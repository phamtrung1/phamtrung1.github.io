<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="refresh" content="0; url=/zh_CN/blog/"/>
    <script>window.location.href = "/zh_CN/blog/";</script>
    <title>Redirecting to News...</title>
</head>
<body>
    <p>Redirecting to <a href="/zh_CN/blog/">新闻与活动</a>...</p>
<script>
// Blog navigation: Remember previously visited blog listing page and restore when clicking tags/breadcrumbs
(function() {
    try {
        var path = window.location.pathname;
        var search = window.location.search || '';
        var isBlogPost = path.indexOf('/post/') !== -1 || /-[0-9]+\/?$/.test(path);
        var isBlogList = (path.indexOf('/blog') !== -1) && !isBlogPost;

        if (isBlogList) {
            sessionStorage.setItem('ta_last_blog_page', path + search);
        }

        document.addEventListener('click', function(e) {
            var a = e.target.closest('a');
            if (!a) return;

            var text = (a.textContent || '').trim().toLowerCase();
            var isTagOrBc = a.hasAttribute('data-back-to-blog') ||
                            a.classList.contains('o_tag') ||
                            a.classList.contains('badge') ||
                            (a.closest('.breadcrumb-item') && (text.indexOf('tin tức') !== -1 || text.indexOf('news') !== -1)) ||
                            text === 'tin tức sự kiện' ||
                            text === 'tin tức & sự kiện' ||
                            text === 'tin tức và sự kiện' ||
                            text === 'news & events' ||
                            text === 'hoạt động công ty' ||
                            text === 'thi công' ||
                            text === 'tuyển dụng';

            if (isTagOrBc && isBlogPost) {
                var isEn = path.indexOf('/en/') !== -1;
                var defaultTarget = isEn ? '/en/blog/' : '/blog/';
                var saved = sessionStorage.getItem('ta_last_blog_page');

                if (saved) {
                    var savedIsEn = saved.indexOf('/en/') !== -1;
                    if (savedIsEn === isEn && saved.indexOf('/blog') !== -1) {
                        e.preventDefault();
                        window.location.href = saved;
                        return;
                    }
                }

                if (document.referrer) {
                    var ref = document.referrer;
                    if (ref.indexOf('/blog') !== -1 && !/-[0-9]+\/?$/.test(ref) && ref.indexOf('/post/') === -1) {
                        e.preventDefault();
                        window.location.href = ref;
                        return;
                    }
                }

                e.preventDefault();
                window.location.href = defaultTarget;
            }
        });
    } catch(err) {}
})();
</script>

<script id="ta-member-units-script">
(function() {
    function initMegaFilter() {
        var containers = document.querySelectorAll('.ta-mega-menu, .ta-page-units-container');
        containers.forEach(function(container) {
            var pills = container.querySelectorAll('.ta-cat-pill');
            var cards = container.querySelectorAll('.ta-company-card, .ta-field-card');
            var titleEl = container.querySelector('.ta-mega-main-title') || container.querySelector('.ta-page-main-title');
            var countEl = container.querySelector('.ta-mega-count-badge') || container.querySelector('.ta-page-count-badge');

            function applyCat(catId, catName) {
                pills.forEach(function(p) {
                    if (p.getAttribute('data-cat') === catId) {
                        p.classList.add('active');
                    } else {
                        p.classList.remove('active');
                    }
                });

                var visibleCount = 0;
                cards.forEach(function(card) {
                    var cardCat = card.getAttribute('data-category');
                    if (catId === 'all' || cardCat === catId) {
                        card.classList.remove('ta-hidden');
                        card.style.setProperty('display', 'flex', 'important');
                        visibleCount++;
                    } else {
                        card.classList.add('ta-hidden');
                        card.style.setProperty('display', 'none', 'important');
                    }
                });

                if (titleEl) {
                    var isEn = window.location.pathname.indexOf('/en/') !== -1;
                    var isZh = window.location.pathname.indexOf('/zh_CN/') !== -1;
                    var isLinhVuc = container.closest('.ta-mega-linhvuc-dropdown') !== null;
                    
                    var allText;
                    if (isLinhVuc) {
                        allText = isEn ? 'All Business Sectors' : (isZh ? '全部核心业务领域' : 'Tất cả lĩnh vực hoạt động');
                    } else {
                        allText = isEn ? 'All Member Companies' : (isZh ? '全部成员单位' : 'Tất cả đơn vị thành viên');
                    }
                    titleEl.textContent = (catId === 'all') ? allText : catName;
                }
                if (countEl) {
                    var isEn = window.location.pathname.indexOf('/en/') !== -1;
                    var isZh = window.location.pathname.indexOf('/zh_CN/') !== -1;
                    var isLinhVuc = container.closest('.ta-mega-linhvuc-dropdown') !== null;
                    var unitText;
                    if (isLinhVuc) {
                        unitText = isEn ? 'sectors' : (isZh ? '大领域' : 'lĩnh vực');
                    } else {
                        unitText = isEn ? 'companies' : (isZh ? '家单位' : 'đơn vị');
                    }
                    countEl.textContent = visibleCount + ' ' + unitText;
                }
            }

            pills.forEach(function(pill) {
                var cId = pill.getAttribute('data-cat');
                var cTextEl = pill.querySelector('.ta-cat-text');
                var cName = cTextEl ? cTextEl.textContent.trim() : '';

                pill.addEventListener('mouseenter', function() {
                    applyCat(cId, cName);
                });

                pill.addEventListener('click', function(e) {
                    e.preventDefault();
                    applyCat(cId, cName);
                });
            });

            cards.forEach(function(card) {
                card.addEventListener('click', function(e) {
                    var href = card.getAttribute('href');
                    if (!href || href === '#' || href === 'javascript:void(0)') {
                        e.preventDefault();
                        var compName = card.getAttribute('data-company-name') || 'Đơn vị';
                        var isEn = window.location.pathname.indexOf('/en/') !== -1;
                        var isZh = window.location.pathname.indexOf('/zh_CN/') !== -1;
                        var msg = isEn ? ('Website for ' + compName + ' is being connected.') :
                                  (isZh ? (compName + ' 的官方网站正在接入中。') :
                                  ('Website của ' + compName + ' đang được kết nối trong hệ sinh thái.'));
                        showTaToast(msg);
                    }
                });
            });
        });
    }

    function showTaToast(message) {
        var container = document.querySelector('.ta-toast-container');
        if (!container) {
            container = document.createElement('div');
            container.className = 'ta-toast-container';
            document.body.appendChild(container);
        }
        var toast = document.createElement('div');
        toast.className = 'ta-toast';
        toast.innerHTML = '<span>🌐</span><span>' + message + '</span>';
        container.appendChild(toast);
        setTimeout(function() {
            toast.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            setTimeout(function() {
                if (toast.parentNode) {
                    toast.parentNode.removeChild(toast);
                }
            }, 300);
        }, 3200);
    }

    // Force Tin tức to always be visible in #top_menu
    function ensureTinTucVisible() {
        var topMenu = document.getElementById('top_menu');
        if (!topMenu) return;
        topMenu.classList.remove('o_menu_loading');
        
        var tinTucLink = topMenu.querySelector('a[href="/blog/"]') || 
                         topMenu.querySelector('a[href*="/blog"]') ||
                         document.querySelector('.o_extra_menu_items a[href*="/blog"]');
        
        if (tinTucLink) {
            var li = tinTucLink.closest('li');
            if (li) {
                li.style.display = 'inline-flex';
                li.style.visibility = 'visible';
                li.classList.add('nav-item');
                li.classList.remove('dropdown-item');
                tinTucLink.className = 'nav-link';
                if (window.location.pathname.indexOf('/blog') !== -1) {
                    tinTucLink.classList.add('active');
                }
                if (li.parentElement !== topMenu) {
                    topMenu.appendChild(li);
                }
            }
        }
        
        var extra = topMenu.querySelector('.o_extra_menu_items');
        if (extra) {
            var remainingChildren = extra.querySelectorAll('.dropdown-menu > li, .dropdown-menu > a');
            remainingChildren.forEach(function(item) {
                if (item.tagName.toLowerCase() === 'li') {
                    item.className = 'nav-item';
                    item.style.display = 'inline-flex';
                    var a = item.querySelector('a');
                    if (a) a.className = 'nav-link';
                    topMenu.insertBefore(item, extra);
                }
            });
            extra.remove();
        }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', function() {
            initMegaFilter();
            ensureTinTucVisible();
        });
    } else {
        initMegaFilter();
        ensureTinTucVisible();
    }
    window.addEventListener('load', ensureTinTucVisible);
    window.addEventListener('resize', ensureTinTucVisible);
    setTimeout(ensureTinTucVisible, 50);
    setTimeout(ensureTinTucVisible, 300);
})();
</script>

</body>
</html>
